[tools]
go = "1.27.1"

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -w $(find . -name '*.go' -not -path './.git/*')"

[tasks.fmt-check]
description = "Verify Go source files are formatted"
run = "test -z \"$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))\""

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.lint]
description = "Run formatting and static analysis"
depends = ["fmt-check", "vet"]

[tasks.check]
description = "Run the full local quality gate"
depends = ["lint", "test"]

[tasks.release-build]
description = "Cross-compile release artifacts for an explicit vX.Y.Z tag"
run = "./scripts/release-build.sh"

[tasks.release-build-check]
description = "Verify release artifact assembly and version validation"
run = "./scripts/release-build-test.sh"
