name: Cut CLM release

on:
  push:
    branches: [main]
    paths:
      - "changelog.d/*.md"

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
      - uses: jdx/mise-action@v2
      - run: mise run check
      - name: Cut the planned release
        run: go run ./cmd/clm cut
      - name: Push CLM-created Git state
        run: git push origin HEAD:main --follow-tags
