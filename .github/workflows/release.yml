name: Publish stable release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to republish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Require an existing stable tag
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "tag must be stable vX.Y.Z" >&2
            exit 1
          }
          git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}" "refs/tags/$TAG"
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Build release artifacts
        run: mise run release-build -- "$TAG"
      - name: Extract the cut changelog entry
        run: go run ./cmd/release-notes "$TAG" > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: false
          body_path: release-notes.md
          files: dist/*
