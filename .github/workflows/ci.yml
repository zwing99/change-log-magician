name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run check
      - name: Validate pull-request fragments
        if: github.event_name == 'pull_request'
        run: go run ./cmd/clm cut --check --require-fragment --base "origin/${{ github.base_ref }}"
  plan-beta:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - id: version
        name: Derive a CI-owned beta tag
        run: |
          plan="$(go run ./cmd/clm next-version --json)"
          version="$(printf '%s' "$plan" | jq -r '.version // empty')"
          if [ -n "$version" ]; then
            prerelease="$(go run ./cmd/clm next-version --json --prerelease-id "beta.pr.${{ github.event.number }}.${{ github.event.pull_request.head.sha }}" | jq -r '.prerelease')"
            echo "tag=v$prerelease" >> "$GITHUB_OUTPUT"
          fi
  publish-beta:
    needs: plan-beta
    if: github.event_name == 'pull_request' && needs.plan-beta.outputs.tag != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan-beta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Configure the CI Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create the CI-owned prerelease tag
        run: |
          git tag -a "$TAG" -m "Pull request beta $TAG"
          git push origin "refs/tags/$TAG"
      - name: Build prerelease artifacts
        run: mise run release-build -- "$TAG"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: true
          body: "Candidate for pull request #${{ github.event.number }}."
          files: dist/*
