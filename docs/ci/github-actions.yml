name: Validate and publish pull-request beta

on:
  pull_request:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: go run ./cmd/clm cut --check --require-fragment --base "origin/${{ github.base_ref }}"
      - id: version
        run: echo 'plan<<EOF' >> "$GITHUB_OUTPUT"; go run ./cmd/clm next-version --json --prerelease-id "beta.pr.${{ github.event.number }}.${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"; echo EOF >> "$GITHUB_OUTPUT"

# Same-repository PRs can turn `.prerelease` into a CI-owned beta tag, run
# `mise run release-build -- "$TAG"`, and publish it with `action-gh-release`.
# Fork PRs must stop after the validation job: do not expose write credentials.
# A protected main workflow runs `mise run check`, `clm cut`, then pushes only
# CLM's resulting commit and tags with a GitHub App token or scoped PAT.
# A separate stable-tag workflow runs only for `vX.Y.Z`; it builds and publishes
# the GitHub Release body extracted from that checked-out tag's CHANGELOG.md.
