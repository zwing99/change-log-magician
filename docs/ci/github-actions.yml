name: Validate release notes

on:
  pull_request:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: go install github.com/zwing99/change-log-magician/cmd/clm@latest
      - run: clm cut --check --require-fragment --base "origin/${{ github.base_ref }}"
      - id: version
        run: echo 'plan<<EOF' >> "$GITHUB_OUTPUT"; clm next-version --json --prerelease-id "pr.${{ github.event.number }}.${{ github.sha }}" >> "$GITHUB_OUTPUT"; echo EOF >> "$GITHUB_OUTPUT"

# A protected push-to-main workflow can run `clm cut`, then `git push --follow-tags`.
